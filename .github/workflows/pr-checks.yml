name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
            
      - name: Install library dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Smoke-test package entry points
        run: npm run smoke:exports

      - name: Test
        run: npm test

      - name: Check Unreleased changelog has content
        run: |
          if ! awk '/^## \[Unreleased\]/{found=1; next} found && /^## /{exit} found && NF{has_content=1} END{exit !has_content}' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::The [Unreleased] section in CHANGELOG.md is empty. Add an entry describing your changes before merging."
            exit 1
          fi
          echo "✓ Unreleased changelog has content"

      - name: Validate CHANGELOG.md is Keep a Changelog compliant
        uses: ConfiguredThings/validate-changelog-action@v4

      - run: npm run build
      - run: npm run lint
      - run: npm test

      # Exercise the code generator end to end (rdp-gen is built above). Runs last
      # because generate:meta writes into src/, which lint would otherwise pick up.
      - name: Check committed examples match generator output
        run: |
          npm run generate:examples
          git diff --exit-code -- examples || {
            echo "::error::examples/ is out of date. Run 'npm run generate:examples' and commit the result."
            exit 1
          }

      - name: Generate and type-check the meta-grammar parsers
        run: |
          npm run generate:meta
          npx tsc -p tsconfig.esm.json --noEmit
